# Lynk — single-service Compose deployment (docs/SPEC.md section 8,
# docs/makefile-plan.md).
#
# Variables (overridable via command line or environment):
#   LYNK_PORT             published host port for the app (default 9090)
#   DOCKER_IMAGE / DOCKER_TAG  image used by make docker-up / docker-pull, etc.
#   LYNK_ENV, LYNK_LOG_LEVEL, LYNK_BASE_URL, LYNK_HEALTH_TIMEOUT  app config
#   LYNK_CORS_ALLOWED_ORIGINS / METHODS / HEADERS / MAX_AGE  browser CORS
#   LYNK_LOGIN_RATE_LIMIT_MAX / WINDOW, LYNK_WEB_MAX_SESSIONS,
#   LYNK_TRUST_PROXY_HEADERS  web login/session safety controls
#     (empty origins = no browser origin is granted Access-Control-* headers;
#      Authorization is never allowed unless explicitly listed in HEADERS)

services:
  lynk:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-ghcr.io/lisieckir/lynk}:${DOCKER_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${LYNK_PORT:-9090}:9090"
    environment:
      LYNK_ENV: ${LYNK_ENV:-production}
      LYNK_HTTP_ADDR: ":9090"
      LYNK_DATA_DIR: /data
      LYNK_DATABASE_PATH: /data/lynk.db
      LYNK_LOG_LEVEL: ${LYNK_LOG_LEVEL:-info}
      LYNK_BASE_URL: ${LYNK_BASE_URL:-https://lynk.example.com}
      LYNK_HEALTH_TIMEOUT: ${LYNK_HEALTH_TIMEOUT:-2s}
      # Safe default: no origins allowed until explicitly configured.
      LYNK_CORS_ALLOWED_ORIGINS: ${LYNK_CORS_ALLOWED_ORIGINS:-}
      LYNK_CORS_ALLOWED_METHODS: ${LYNK_CORS_ALLOWED_METHODS:-GET,POST}
      LYNK_CORS_ALLOWED_HEADERS: ${LYNK_CORS_ALLOWED_HEADERS:-Content-Type}
      LYNK_CORS_MAX_AGE: ${LYNK_CORS_MAX_AGE:-600}
      LYNK_LOGIN_RATE_LIMIT_MAX: ${LYNK_LOGIN_RATE_LIMIT_MAX:-10}
      LYNK_LOGIN_RATE_LIMIT_WINDOW: ${LYNK_LOGIN_RATE_LIMIT_WINDOW:-1m}
      LYNK_WEB_MAX_SESSIONS: ${LYNK_WEB_MAX_SESSIONS:-10000}
      LYNK_TRUST_PROXY_HEADERS: ${LYNK_TRUST_PROXY_HEADERS:-false}
    volumes:
      - lynk_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  lynk_data:
