{{define "bookmark_form"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .IsEdit}}Edit{{else}}New{{end}} Bookmark - Lynk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>{{if .IsEdit}}Edit Bookmark{{else}}New Bookmark{{end}}</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="{{if .IsEdit}}/bookmarks/{{.Bookmark.ID}}/edit{{else}}/bookmarks{{end}}">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="url">URL *</label>
      <input type="url" id="url" name="url" value="{{if .Bookmark}}{{.Bookmark.URL}}{{end}}" required>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{if .Bookmark}}{{.Bookmark.Title}}{{end}}">

      <label for="description">Description</label>
      <textarea id="description" name="description">{{if .Bookmark}}{{.Bookmark.Description}}{{end}}</textarea>

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes">{{if .Bookmark}}{{.Bookmark.Notes}}{{end}}</textarea>

      <label for="tags">Tags (comma-separated)</label>
      <input type="text" id="tags" name="tags" value="{{if .TagsStr}}{{.TagsStr}}{{end}}">

      <label><input type="checkbox" name="unread" value="1" {{if and .Bookmark .Bookmark.Unread}}checked{{end}}> Unread</label>
      <label><input type="checkbox" name="shared" value="1" {{if and .Bookmark .Bookmark.Shared}}checked{{end}}> Shared</label>

      <div class="actions-row">
        <button type="submit">{{if .IsEdit}}Save{{else}}Create{{end}}</button>
        <a href="/">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
{{end}}
