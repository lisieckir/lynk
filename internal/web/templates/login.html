{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Lynk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Lynk</h1>
    <h2>Sign in</h2>
    {{if .Error}}<div class="error">Error: {{.Error}}</div>{{end}}
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="token">API Token</label>
      <input type="text" id="token" name="token" autocomplete="off" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">Use the API token created with <code>lynk token create</code>.</p>
  </div>
</body>
</html>
{{end}}
